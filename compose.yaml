name: bsj-dashboard

services:
  backend:
    build: ./backend
    container_name: bsj-backend
    ports:
      - "8001:8000"
    volumes:
      - ./bsj-raw-data:/app/data
    environment:
      - DATA_PATH=/app/data
    networks:
      - bsj-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8001
    container_name: bsj-dashboard-web
    ports:
      - "3000:80"
    networks:
      - bsj-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  bsj-net:
    driver: bridge
